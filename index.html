<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My First JavaScript.</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>My First JavaScript.</h1>

<button id="showBtn">click to show</button>
<p id="revealText" class="hidden">
  Nice! You just toggled some text with JavaScript — the same idea powers the
  light bulb below: a click calls a function, the function changes the DOM,
  and the browser repaints.
</p>

<div class="bulb-wrap">
  <svg id="bulb" viewBox="0 0 200 320" width="180" height="288">
    <defs>
      <radialGradient id="glow" cx="50%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#fff6c8" />
        <stop offset="55%" stop-color="#ffe066" />
        <stop offset="100%" stop-color="#f6c343" />
      </radialGradient>
    </defs>
    <!-- glass -->
    <path id="glass" d="M100 10 C45 10 20 55 20 100 C20 145 45 165 65 185
                        C75 195 78 205 78 215 L122 215 C122 205 125 195 135 185
                        C155 165 180 145 180 100 C180 55 155 10 100 10 Z"
          fill="#e9e9ec" stroke="#c7c7cf" stroke-width="3"/>
    <!-- filament -->
    <path d="M85 90 L115 130 L85 150 L115 185" fill="none" stroke="#9a9aa2" stroke-width="4" stroke-linecap="round" />
    <!-- neck -->
    <rect x="78" y="215" width="44" height="14" fill="#8a8a92" />
    <!-- screw base -->
    <g id="base">
      <rect x="76" y="229" width="48" height="10" rx="2" fill="#2b2b2f" />
      <rect x="78" y="241" width="44" height="9" rx="2" fill="#f0a93c" />
      <rect x="78" y="252" width="44" height="9" rx="2" fill="#f0a93c" />
      <rect x="78" y="263" width="44" height="9" rx="2" fill="#f0a93c" />
      <rect x="82" y="274" width="36" height="14" rx="6" fill="#1c1c1f" />
    </g>
  </svg>
</div>

<div class="controls">
  <button id="onBtn">Turn on</button>
  <button id="offBtn">Turn off</button>
</div>

<p id="status">The bulb is off.</p>

<script src="script.js"></script>
</body>
</html>
